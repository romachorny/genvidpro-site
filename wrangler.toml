# Deploy configuration for the Cloudflare Pages project "genvidpro".
# It has to sit here, in the project root: Pages refuses --config elsewhere, and a
# deploy run from another folder silently ships WITHOUT the functions bundle —
# /chat and /ev came back 405 until this was moved back (checked 05.09.2026).
# The file is uploaded with the site, so /wrangler.toml is closed in _redirects.
# It exists for one reason: the KV store behind the funnel counter and the chat
# ceiling has to be bound to the deployment, and a direct upload has nowhere else
# to read that from.
name = "genvidpro"
pages_build_output_dir = "."
compatibility_date = "2026-09-05"

[[kv_namespaces]]
binding = "EVENTS"
id = "f2e23da908244bb39ed0c3be854ce83b"

# 28.09.2026: the personal notifications keep their subscribers here and not in KV.
# KV needed 8 to 30 seconds before a brand new subscriber showed up in a list, and the
# whole point of this is that Roma sends the guest a message the moment they sign up.
# Schema and the why: ops/push-schema.sql.
[[d1_databases]]
binding = "PUSHDB"
database_name = "gvp-push"
database_id = "fcc906ab-d6b2-4f25-88c8-bd02d8a075ae"

# 29.09.2026: the site checker's findings come from a real Chromium that draws the
# visitor's page at a phone's size. That browser is the gvp-render Worker (render/ in
# this repo, published by ops/render-deploy.sh). It has no public address at all — this
# binding is the only way in, which is why it needs no shared secret.
# TURN THIS ON once gvp-render exists (ops/render-deploy.sh). It is off because a Pages
# deployment that binds a Worker which is not there yet would answer every check with an
# error, and /preview is a button on a live sales page. With the binding off, the checker
# reads the HTML and says so; with it on, a real browser draws the page. 29.09.2026: the
# Cloudflare token can only do Pages — it needs Workers Scripts:Edit and Browser
# Rendering:Edit before the Worker can be published at all.
# [[services]]
# binding = "RENDER"
# service = "gvp-render"

[env.preview]
[[env.preview.kv_namespaces]]
binding = "EVENTS"
id = "f2e23da908244bb39ed0c3be854ce83b"

[[env.preview.d1_databases]]
binding = "PUSHDB"
database_name = "gvp-push"
database_id = "fcc906ab-d6b2-4f25-88c8-bd02d8a075ae"

# [[env.preview.services]]
# binding = "RENDER"
# service = "gvp-render"
