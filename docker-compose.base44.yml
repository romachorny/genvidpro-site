# Base44 dev environment for genvidpro.com
# Static site (plain HTML/CSS/JS, no build step) served by nginx.
# The Cloudflare Pages Functions in functions/ require Cloudflare's runtime
# (KV, D1, Workers bindings) and an Anthropic API key; they are not served here.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./ops/nginx-base44.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx-base44-main.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
