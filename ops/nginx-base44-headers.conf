# Headers that Cloudflare Pages reads from _headers and nginx does not.
# Included from every location in ops/nginx-base44.conf, because an add_header
# inside a location silently drops the ones inherited from the server block.
#
# Three deliberate differences from _headers, all in this copy only — the file is
# excluded from the Cloudflare publish set and never reaches the live site:
#  - frame-ancestors allows Base44, because the copy is previewed in an iframe
#    on app.base44.com;
#  - connect-src allows Base44 for the same reason;
#  - connect-src allows genvidpro.com, because gvp-wa.js reads /services.json and
#    /api/ref from the real site whenever it runs anywhere else. That is the script's
#    own design, the same path it takes on app.genvidpro.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://genvidpro.com https://api.microlink.io https://iad.microlink.io https://images.metmuseum.org https://upload.wikimedia.org https://thumb.wikimedia.org https://commons.wikimedia.org; media-src 'self' blob: data: https://genvidpro.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.web3forms.com https://cloudflareinsights.com https://genvidpro.com https://app.base44.com https://*.base44.com; form-action 'self' https://api.web3forms.com https://wa.me https://api.whatsapp.com; frame-src 'self' blob: data: https:; object-src 'none'; frame-ancestors 'self' https://genvidpro.com https://www.genvidpro.com https://*.genvidpro.pages.dev https://app.base44.com https://*.base44.com https://*.base44-preview.app; base-uri 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
