# The Base44 preview of genvidpro.com. Cloudflare Pages reads _headers; nginx does
# not, so every rule in that file is restated here. Keep the two in step: a header
# added to _headers and not to this file is a header the Base44 copy does not send.
#
# Regex locations are tried in the order they appear, so the closed doors come first.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Pages never serves any of this: it drops wrangler.toml and functions/
    # on its own, and ops/ is cut out of the publish set by ops/deploy.sh. Here the
    # whole repository is the web root, so the same doors have to be closed by hand.
    # Without these three lines /ops/deploy.sh, /functions/chat.js and /wrangler.toml —
    # which carries the KV and D1 identifiers — all answer 200 on the preview address.
    location ~ ^/(ops|functions|\.base44|\.git|\.wrangler|node_modules)/ { return 404; }
    location ~ ^/(wrangler\.toml|AGENTS\.md|README\.md|docker-compose\.base44\.yml|deploy-log\.txt|deploy\.cmd|_headers|_redirects|\.gitignore)$ { return 404; }
    location ~ \.(py|sh|sql|bak|toml)$ { return 404; }

    # Never cached: the shell, the worker, and every script that changes with the pages
    # it serves. _headers says no-cache for all of these, and it says so because a fix
    # once took four hours to reach a phone that had opened the site that morning.
    location = /sw.js {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~ ^/(manifest\.json|tpl-engine\.js|i18n\.js|assistant\.js|gv-chrome\.js|push\.js|index\.html|builder\.html)$ {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # The pages themselves, under both names Cloudflare serves them by.
    location ~ ^/(builder|living-paintings|work|learn|os|terms|privacy)(\.html)?$ {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    # Read cross-origin by gvp-wa.js on app.genvidpro.com and by the WhatsApp agent.
    # Public prices only.
    location = /services.json {
        include /etc/nginx/base44-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /services.schema.json {
        include /etc/nginx/base44-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /gvp-wa.js {
        include /etc/nginx/base44-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # Films and stills never change under the same name.
    location ~ ^/(media|videos)/ {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ~ ^/fonts/ {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/base44-headers.conf;
        internal;
    }

    location / {
        include /etc/nginx/base44-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
