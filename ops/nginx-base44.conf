server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Pages _headers equivalents: never cache the shell or JS that changes
    location ~ ^/(sw\.js|manifest\.json|tpl-engine\.js|i18n\.js|assistant\.js|gv-chrome\.js|push\.js|index\.html|builder\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Media and fonts can be cached
    location ~ ^/(media|fonts)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Use the site's own 404 page
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
